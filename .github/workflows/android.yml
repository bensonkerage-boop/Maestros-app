name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest is moving to Ubuntu 26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      # Set API_BASE as a repository variable (Settings > Secrets and variables > Actions > Variables),
      # e.g. https://your-project.vercel.app
      - run: npm run build:android
        env:
          API_BASE: ${{ vars.API_BASE }}
      - name: Gradle build (retries if the Gradle download times out)
        run: |
          cd android && chmod +x gradlew
          for i in 1 2 3; do ./gradlew assembleDebug && exit 0; echo "Attempt $i failed, retrying in 20s"; sleep 20; done; exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: MASMS-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
