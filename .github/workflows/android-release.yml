name: Build Play Store release
# Needs repository variable API_BASE and secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS
# (see PLAY_STORE.md). Produces a signed .aab to upload in the Play Console.
on:
  workflow_dispatch:
jobs:
  aab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build:android
        env:
          API_BASE: ${{ vars.API_BASE }}
          # Optional: set repository variable LIVE_UPDATES=1 to make the app load from your Vercel site (updates without Play Store releases)
          LIVE_URL: ${{ vars.LIVE_UPDATES == '1' && vars.API_BASE || '' }}
      - name: Restore signing key
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/masms-upload.jks"
      - name: Pre-download Gradle (tries gradle.org, then mirrors)
        run: |
          V=8.14.3
          ok=0
          for url in "https://services.gradle.org/distributions/gradle-$V-bin.zip" \
                     "https://mirrors.cloud.tencent.com/gradle/gradle-$V-bin.zip" \
                     "https://mirrors.aliyun.com/gradle/gradle-$V-bin.zip"; do
            echo "Trying $url"
            if curl -fL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 20 --max-time 300 -o "$RUNNER_TEMP/gradle.zip" "$url" && unzip -tq "$RUNNER_TEMP/gradle.zip" >/dev/null; then ok=1; break; fi
          done
          if [ "$ok" = 1 ]; then
            sed -i "s#^distributionUrl=.*#distributionUrl=file\\:$RUNNER_TEMP/gradle.zip#; s#^validateDistributionUrl=.*#validateDistributionUrl=false#" android/gradle/wrapper/gradle-wrapper.properties
            cat android/gradle/wrapper/gradle-wrapper.properties
          else
            echo "Could not pre-download Gradle; the wrapper will try on its own"
          fi
      - name: Build signed bundle
        run: |
          cd android && chmod +x gradlew
          for i in 1 2 3 4 5; do ./gradlew bundleRelease && exit 0; echo "Attempt $i failed, retrying in 30s"; sleep 30; done; exit 1
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/masms-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: MASMS-play-release
          path: android/app/build/outputs/bundle/release/app-release.aab
