name: Create Play Store signing key
# Run this ONCE. It creates your upload key and shows the 4 values to save as repository secrets.
# Download the artifact, keep a copy somewhere safe (losing the key means you cannot update the app), then delete the artifact.
on:
  workflow_dispatch:
jobs:
  key:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Generate key
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -v -keystore masms-upload.jks -alias masms -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=MASMS, O=Maestro, C=KE"
          {
            echo "KEYSTORE_PASSWORD = $PASS"
            echo "KEY_PASSWORD      = $PASS"
            echo "KEY_ALIAS         = masms"
            echo "KEYSTORE_BASE64   = (see keystore-base64.txt)"
          } > secrets.txt
          base64 -w0 masms-upload.jks > keystore-base64.txt
      - name: Upload the key (retried; gives up after 2 minutes)
        id: up1
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: MASMS-signing-key
          path: |
            masms-upload.jks
            secrets.txt
            keystore-base64.txt
      - name: Upload the key (second try)
        id: up2
        if: steps.up1.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: MASMS-signing-key-2
          path: |
            masms-upload.jks
            secrets.txt
            keystore-base64.txt
      - name: Last resort - show the values in this log
        # Only runs when both uploads failed (e.g. GitHub's artifact storage is unreachable). Anyone who can open this run's
        # log can read these, so copy them into repository secrets straight away and then DELETE this run (Actions > the run > ... > Delete).
        if: steps.up1.outcome != 'success' && steps.up2.outcome != 'success'
        run: |
          echo "Copy these into repository secrets, then delete this workflow run."
          cat secrets.txt
          echo "KEYSTORE_BASE64 value:"
          cat keystore-base64.txt; echo
