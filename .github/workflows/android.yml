name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest is moving to Ubuntu 26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      # Set API_BASE as a repository variable (Settings > Secrets and variables > Actions > Variables),
      # e.g. https://your-project.vercel.app
      - run: npm run build:android
        env:
          API_BASE: ${{ vars.API_BASE }}
      - name: Pre-download Gradle (tries gradle.org, then mirrors)
        run: |
          V=8.14.3
          ok=0
          for url in "https://services.gradle.org/distributions/gradle-$V-bin.zip" \
                     "https://mirrors.cloud.tencent.com/gradle/gradle-$V-bin.zip" \
                     "https://mirrors.aliyun.com/gradle/gradle-$V-bin.zip"; do
            echo "Trying $url"
            if curl -fL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 20 --max-time 300 -o "$RUNNER_TEMP/gradle.zip" "$url" && unzip -tq "$RUNNER_TEMP/gradle.zip" >/dev/null; then ok=1; break; fi
          done
          if [ "$ok" = 1 ]; then
            sed -i "s#^distributionUrl=.*#distributionUrl=file\\:$RUNNER_TEMP/gradle.zip#; s#^validateDistributionUrl=.*#validateDistributionUrl=false#" android/gradle/wrapper/gradle-wrapper.properties
            cat android/gradle/wrapper/gradle-wrapper.properties
          else
            echo "Could not pre-download Gradle; the wrapper will try on its own"
          fi
      - name: Gradle build (retries if the Gradle download times out)
        run: |
          cd android && chmod +x gradlew
          for i in 1 2 3 4 5; do ./gradlew assembleDebug && exit 0; echo "Attempt $i failed, retrying in 30s"; sleep 30; done; exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: MASMS-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
