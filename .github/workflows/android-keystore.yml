name: Create Play Store signing key
# Run this ONCE. It creates your upload key and shows the 4 values to save as repository secrets.
# Download the artifact, keep a copy somewhere safe (losing the key means you cannot update the app), then delete the artifact.
on:
  workflow_dispatch:
jobs:
  key:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Generate key
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -v -keystore masms-upload.jks -alias masms -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=MASMS, O=Maestro, C=KE"
          {
            echo "KEYSTORE_PASSWORD = $PASS"
            echo "KEY_PASSWORD      = $PASS"
            echo "KEY_ALIAS         = masms"
            echo "KEYSTORE_BASE64   = (see keystore-base64.txt)"
          } > secrets.txt
          base64 -w0 masms-upload.jks > keystore-base64.txt
      - uses: actions/upload-artifact@v7
        with:
          name: MASMS-signing-key
          path: |
            masms-upload.jks
            secrets.txt
            keystore-base64.txt
